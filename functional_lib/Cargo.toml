[package]
name = "rcs-functional"
authors = ["Rafael Cardoso dos Santos <racasantos@icloud.com>"]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[lib]
name = "rcs_functional"
path = "src/lib.rs"

[dependencies]
rayon = "1.11"
im = "15.1"
itertools = "0.14"
tokio = { version = "1.35.0", features = ["rt", "rt-multi-thread", "fs", "io-util", "sync", "time", "macros"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
thiserror = "2.0.17"
async-trait = "0.1.89"
futures = "0.3.28"
num_cpus = "1.17"
rand = "0.8"
regex = "1.10"
once_cell = "1.18"
actix-web = "4.3.1"
actix-rt = "2.8.0"
awc = "3.8.1"
log = "0.4.18"
url = "2.4"
chrono = { version = "0.4.26", features = ["serde"] }
uuid = { version = "1.3.3", features = ["v4"] }
rust_decimal = { version = "1.38", features = ["serde", "db-diesel-postgres"] }
diesel = { version = "2.2.0", features = ["postgres", "r2d2"] }