[package]
name = "rcs"
version = "0.2.0"
authors = ["Rafael Cardoso dos Santos <racasantos@icloud.com>"]
edition = "2021"
rust-version = "1.86"
build = "build.rs"

[workspace]
members = ["functional_lib"]

[lib]
name = "rcs"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = "1.0"
actix-web = "4.3.1"
actix-rt = "2.8.0"
actix-service = "2.0.2"
actix-cors = "0.6.4"
actix-ws = "0.3"
actix-session = { version = "0.10.1", features = ["cookie-session"] }
awc = "3.8.1"
log = "0.4.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-log = "0.2"
tracing-actix-web = "0.7"
diesel_migrations = "2.1.0"
serde = "1.0.163"
serde_derive = "1.0.163"
serde_json = "1.0.96"
prost = "0.12"
tonic = "0.11"
config = "0.14"
dotenvy = "0.15"
futures = "0.3.28"
derive_more = "0.99.17"
jsonwebtoken = "8.3.0"
bcrypt = "0.14.0"
base64 = "0.21.2"
redis = "0.32.7"
r2d2 = "0.8.10"
openidconnect = "4.0.1"
reqwest = { version = "0.12.26", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tokio = { version = "1.35.0", features = ["rt", "rt-multi-thread", "fs", "io-util", "sync", "time", "macros"] }
notify = "6.1"
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["trace"] }
tower = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros"] }
url = "2.4"
itertools = "0.14"
rayon = { version = "1.11", optional = true }
im = "15.1"
thiserror = "2.0.17"
regex = "1.10"
once_cell = "1.18"
home = "=0.5.11"
num_cpus = "1.17"
rand = "0.8"
argon2 = "0.5"
diesel-derive-enum = { version = "2.1", features = ["postgres"] }
rust_decimal = { version = "1.38", features = ["serde", "db-diesel-postgres"] }
bigdecimal = { version = "0.4.8", features = ["serde"] }
async-trait = "0.1.89"
aes-gcm = "0.10"
validator = { version = "0.20", features = ["derive"] }
secrecy = { version = "0.10.3", features = ["serde"] }

rcs-functional = { path = "functional_lib", optional = true }

# XML parsing (well-formedness checks for xml_content payloads)
quick-xml = "0.38"

# OpenAPI/Swagger documentation
utoipa = { version = "4", features = ["actix_extras", "chrono", "uuid"] }
# Enable `reqwest` feature so the build script can download Swagger UI using Rust instead of system `curl`
utoipa-swagger-ui = { version = "7", features = ["actix-web", "reqwest"] }

[dependencies.diesel]
version = "2.2.0"
features = ["postgres", "r2d2"]

[dependencies.oracle]
version = "0.6"
optional = true

[dependencies.chrono]
version = "0.4.26"
features = ["serde"]
optional = true

[dependencies.uuid]
version = "1.3.3"
features = ["v4"]

[features]
default = ["functional", "performance_monitoring", "datetime"]  # Enable functional features by default to support refactoring
functional = ["rcs-functional"]
performance_monitoring = []
datetime = ["dep:chrono", "diesel/chrono"]
hybrid-db = ["dep:oracle"]  # Enable Oracle support for hybrid database mode

[dev-dependencies]
testcontainers = "0.14.0"
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tonic-health = "0.11"

[build-dependencies]
tonic-build = "0.11"

[[bench]]
name = "functional_benchmarks"
harness = false

[profile.dev]
opt-level = 1           # Basic optimizations for faster builds
codegen-units = 16      # More codegen units for parallel compilation
debug = true            # Keep debug info
incremental = true      # Enable incremental compilation

[profile.release]
opt-level = 3           # Maximum optimization
lto = "fat"            # Link-time optimization across all crates
codegen-units = 1      # Single codegen unit = better optimization
strip = true           # Strip symbols
panic = "abort"        # Smaller binary, faster panics

[profile.release.package."*"]
opt-level = 3
