[package]
name = "rcs"
version = "0.1.0"
authors = ["Rafael Cardoso dos Santos <racasantos@icloud.com>"]
edition = "2021"
rust-version = "1.86"
build = "build.rs"

[lib]
name = "rcs"
path = "src/lib.rs"
doctest = false

[dependencies]
actix-web = "4.3.1"
actix-rt = "2.8.0"
actix-service = "2.0.2"
actix-cors = "0.7.1"
actix-ws = "0.3"
awc = "3.8.1"
log = "0.4.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-log = "0.2"
tracing-actix-web = "0.7"
diesel_migrations = "2.1.0"
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
dotenv = "0.15.0"
futures = "0.3.28"
derive_more = "0.99.17"
jsonwebtoken = "8.3.0"
bcrypt = "0.14.0"
base64 = "0.21.2"
redis = "0.32.7"
r2d2 = "0.8.10"
tokio = { version = "1.35.0", features = ["rt", "rt-multi-thread", "fs", "io-util", "sync", "time", "macros"] }
url = "2.4"
itertools = "0.14"
async-trait = "0.1.89"
aes-gcm = "0.10"
validator = { version = "0.20", features = ["derive"] }
rayon = { version = "1.7", optional = true }

# XML parsing (well-formedness checks for xml_content payloads)
quick-xml = "0.38"

# OpenAPI/Swagger documentation
utoipa = { version = "4", features = ["actix_extras", "chrono", "uuid"] }
# Enable `reqwest` feature so the build script can download Swagger UI using Rust instead of system `curl`
utoipa-swagger-ui = { version = "7", features = ["actix-web", "reqwest"] }

[dependencies.diesel]
version = "2.2.0"
features = ["postgres", "r2d2"]

[dependencies.chrono]
version = "0.4.26"
features = ["serde"]
optional = true

[dependencies.uuid]
version = "1.3.3"
features = ["v4"]

[features]
default = ["functional", "performance_monitoring", "datetime"]  # Enable functional features by default to support refactoring
functional = ["dep:rayon"]
performance_monitoring = []
datetime = ["dep:chrono", "diesel/chrono"]

[dev-dependencies]
testcontainers = "0.14.0"
criterion = { version = "0.5", features = ["html_reports"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

[[bench]]
name = "functional_benchmarks"
harness = false

[profile.dev]
opt-level = 1           # Basic optimizations for faster builds
codegen-units = 16      # More codegen units for parallel compilation
debug = true            # Keep debug info
incremental = true      # Enable incremental compilation

[profile.release]
opt-level = 3           # Maximum optimization
lto = "fat"            # Link-time optimization across all crates
codegen-units = 1      # Single codegen unit = better optimization
strip = true            # Strip symbols
panic = "abort"        # Smaller binary, faster panics

[profile.release.package."*"]
opt-level = 3
