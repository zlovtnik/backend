apiVersion: v1
kind: Secret
metadata:
  name: jaeger-ca
  labels:
    io.kompose.service: jaeger
type: Opaque
stringData:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    # Replace with your Jaeger CA certificate content here
    # To generate a self-signed CA for development:
    # openssl req -x509 -newkey rsa:2048 -keyout jaeger-key.pem -out jaeger-ca.crt -days 365 -nodes -subj "/CN=jaeger"
    # 
    # Then base64 encode and paste the certificate content between these markers
    -----END CERTIFICATE-----
