apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: redis-exporter
  name: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis-exporter
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: redis-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534  # nobody user
        fsGroup: 65534
      containers:
        - env:
            - name: REDIS_ADDR
              value: redis:6379
          image: docker.io/oliver006/redis_exporter:v1.59.0
          name: middleware-redis-exporter
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 9121
              protocol: TCP
      restartPolicy: Always
