apiVersion: v1
data:
  collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024

      resource:
        attributes:
          - key: service.namespace
            value: "middleware-stack"
            action: upsert
          - key: service.version
            from_attribute: "service.version"
            action: upsert
          - key: environment
            from_attribute: "environment"
            action: upsert

      memory_limiter:
        limit_mib: 512
        spike_limit_mib: 128
        check_interval: 5s

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "middleware"

      debug:
        verbosity: basic

      otlphttp:
        endpoint: "https://jaeger:4318"
        tls:
          insecure: false
          ca_file: /etc/otel-collector/jaeger-ca.crt

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [debug, otlphttp]

        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [prometheus]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [debug, otlphttp]

      extensions:
        - health_check

      telemetry:
        logs:
          level: info
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: otel-collector
  name: otel-collector-cm0
