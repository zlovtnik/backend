apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: redis
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: redis
    spec:
      containers:
        - args:
            - redis-server
            - /etc/redis/redis.conf
            - --bind
            - 0.0.0.0
          image: docker.io/redis:7-alpine
          livenessProbe:
            tcpSocket:
              port: 6379
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
                - ping
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          name: middleware-redis
          ports:
            - containerPort: 6379
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: redis-data
            - mountPath: /etc/redis/redis.conf
              name: redis-cm1
              subPath: redis.conf
      restartPolicy: Always
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
        - configMap:
            items:
              - key: redis.conf
                path: redis.conf
            name: redis-cm1
          name: redis-cm1
