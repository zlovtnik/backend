apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: kafka-connect
  name: kafka-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: kafka-connect
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: kafka-connect
    spec:
      containers:
        - command:
            - bash
            - -c
            - |
              echo "Installing Debezium PostgreSQL Connector..."
              if ! confluent-hub install --no-prompt debezium/debezium-connector-postgresql:2.4.1; then
                echo "WARNING: Failed to install Debezium connector. Proceeding anyway for dev environment."
              fi
              echo "Starting Kafka Connect..."
              exec /etc/confluent/docker/run
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              value: kafka:9093
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: _connect-configs
            - name: CONNECT_GROUP_ID
              value: connect-cluster
            - name: CONNECT_KEY_CONVERTER
              value: org.apache.kafka.connect.storage.StringConverter
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: _connect-offsets
            - name: CONNECT_PLUGIN_PATH
              value: /usr/share/java,/usr/share/confluent-hub-components
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              value: kafka-connect
            - name: CONNECT_REST_PORT
              value: "8083"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: _connect-status
            - name: CONNECT_VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
          image: docker.io/confluentinc/cp-kafka-connect:7.5.0
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:8083/
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: middleware-kafka-connect
          ports:
            - containerPort: 8083
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/share/confluent-hub-components
              name: kafka-connect-plugins
      restartPolicy: Always
      volumes:
        - name: kafka-connect-plugins
          persistentVolumeClaim:
            claimName: kafka-connect-plugins
