apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: otel-collector
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: otel-collector
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: otel-collector
    spec:
      containers:
        - args:
            - --config=/etc/otel-collector-config.yaml
          env:
            - name: SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: otel-collector-config
                  key: service-version
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: otel-collector-config
                  key: environment
          image: docker.io/otel/opentelemetry-collector:0.95.0
          livenessProbe:
            httpGet:
              path: /health
              port: 13133
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 13133
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          name: middleware-otel-collector
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 4317
              protocol: TCP
            - containerPort: 4318
              protocol: TCP
            - containerPort: 55679
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/otel-collector-config.yaml
              name: otel-collector-cm0
              readOnly: true
              subPath: otel-collector-config.yaml
            - mountPath: /etc/otel-collector
              name: jaeger-ca
              readOnly: true
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: collector-config.yaml
                path: otel-collector-config.yaml
            name: otel-collector-cm0
          name: otel-collector-cm0
        - name: jaeger-ca
          secret:
            secretName: jaeger-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: jaeger-ca.crt
