# Redis configuration for middleware stack
# WARNING: This configuration is for development/Docker environments only.
# Production deployments should:
# - Bind to specific network interfaces (not 0.0.0.0)
# - Enable authentication with requirepass
# - Configure TLS/SSL encryption
# - Use Redis ACLs for access control

# Network
bind 0.0.0.0  # WARNING: Binds to all interfaces - restrict in production
port 6379
timeout 0
tcp-keepalive 300

# General
daemonize no
supervised no
loglevel notice
logfile ""

# Snapshotting
save 900 1
save 300 10
save 60 10000

# Security - COMMENTED OUT FOR DEVELOPMENT ONLY
# requirepass yourpasswordhere  # Enable strong password in production

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Append only file
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command SHUTDOWN SHUTDOWN_REDIS

# Enable Redis Cluster if needed
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 5000

# Performance tuning
tcp-backlog 511
databases 16

# Disable THP (Transparent Huge Pages) warnings
# This should be set at system level, but we can note it here

# Enable active defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 5
active-defrag-cycle-max 75

# WARNING: Disable protected mode - only safe in controlled containerized environments
# protected-mode prevents external connections when no password is set
protected-mode no
