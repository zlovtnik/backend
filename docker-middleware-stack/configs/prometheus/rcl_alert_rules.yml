groups:
  - name: rcl_pipeline_alerts
    interval: 30s
    rules:
      # Phase 5.3: Alerting rules for critical metrics
      - alert: HighConsumerLag
        expr: lag_ms > 600000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High consumer lag detected ({{ $value }}ms)"
          description: "Consumer lag for {{ $labels.topic }} partition {{ $labels.partition }} exceeds 10 minutes"

      - alert: CriticalConsumerLag
        expr: lag_ms > 1800000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical consumer lag ({{ $value }}ms)"
          description: "Consumer lag for {{ $labels.topic }} partition {{ $labels.partition }} exceeds 30 minutes"

      - alert: HighErrorRate
        expr: (rate(processing_failures[5m]) + rate(decode_failures[5m])) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate exceeds 10 errors/sec"

      - alert: DLQBacklog
        expr: rate(dlq_total[5m]) > 100
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "DLQ receiving high message rate"
          description: "DLQ message rate exceeds 100 messages/sec"

      - alert: SlowWriteLatency
        expr: histogram_quantile(0.99, rate(write_latency_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow write latency (p99)"
          description: "Write latency p99 exceeds 5 seconds"

      - alert: HighRetryRate
        expr: rate(retry_attempts[1m]) > 50
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High retry rate detected"
          description: "Retry rate exceeds 50 retries/sec - possible transient DB issues"

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state{} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker OPEN for pipeline"
          description: "Circuit breaker is open for pipeline {{ $labels.pipeline }} - pipeline is not processing messages"

      - alert: CircuitBreakerHalfOpen
        expr: circuit_breaker_state{} == 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker in HALF_OPEN state"
          description: "Circuit breaker is in half-open state for pipeline {{ $labels.pipeline }} - testing recovery"

      - alert: HighChannelDepth
        expr: channel_depth_per_pipeline > 15000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High pipeline channel depth"
          description: "Channel depth for {{ $labels.pipeline }} exceeds 15000 messages"

      - alert: LowThroughput
        expr: rate(messages_total[5m]) < 100 and rate(messages_total[5m]) > 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Low message throughput"
          description: "Message throughput has dropped below 100 messages/sec"

      - alert: NoMessages
        expr: increase(messages_total[5m]) <= 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No messages being processed"
          description: "No messages have been processed in the last 5 minutes - pipeline may be stuck"
