# PostgreSQL configuration for Debezium CDC support

# Network settings - DEVELOPMENT ONLY: Listen on all interfaces for Docker networking
# PRODUCTION: Use listen_addresses = 'localhost' or restrict to specific interfaces
# For production deployments, configure via environment variable or use a restricted config
listen_addresses = '*'

# Replication settings (required for Debezium logical replication)
wal_level = logical
max_wal_senders = 4
max_replication_slots = 4

# WAL settings for reliability
wal_keep_size = 1024  # 1GB of WAL to keep
max_connections = 200
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200

# Synchronous commit - PERFORMANCE vs DURABILITY TRADE-OFF
# off = Higher throughput, lower durability (potential transaction loss on crash)
# on = Lower throughput, guaranteed durability (exactly-once semantics/offset tracking)
# PRODUCTION DEFAULT: on (configurable via environment variable for development)
# DEVELOPMENT: Set POSTGRES_SYNCHRONOUS_COMMIT=off in docker-compose.yml for performance
synchronous_commit = on

# Performance tuning
shared_preload_libraries = ''

# Logging
log_statement = 'none'
log_duration = off
